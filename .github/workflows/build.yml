name: Build AppLibrary12

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debian Package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            make \
            perl \
            fakeroot \
            rsync \
            zip \
            build-essential \
            libxml2-dev \
            libplist-dev \
            ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$HOME/theos/sdks"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build Debian package
        run: |
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1

      - name: Verify package
        run: |
          set -e
          mkdir -p release

          DEB_FILE=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)

          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: No .deb package generated."
            exit 1
          fi

          cp "$DEB_FILE" release/

      - name: Set release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AppLibrary12 ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
