name: Build AppLibrary12

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debian Package
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid make perl

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$HOME/theos/sdks"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build Debian package
        run: |
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1

      - name: Verify package
        run: |
          set -e
          DEB_FILE="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"

          if [ -z "$DEB_FILE" ]; then
            echo "No Debian package was produced."
            exit 1
          fi

          echo "Built package: $DEB_FILE"
          echo "DEB_FILE=$DEB_FILE" >> "$GITHUB_ENV"

      - name: Set release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AppLibrary12 ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: packages/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
