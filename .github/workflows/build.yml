name: Build AppLibrary12

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debian Package
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install dpkg ldid xz

      - name: Install Theos
        run: |
          set -euo pipefail

          export THEOS="$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS SDK
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"

          test -d "$RUNNER_TEMP/theos-sdks/iPhoneOS12.4.sdk"
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS12.4.sdk" "$THEOS/sdks/"

          test -d "$THEOS/sdks/iPhoneOS12.4.sdk/System/Library/Frameworks"
          echo "Installed SDK: $THEOS/sdks/iPhoneOS12.4.sdk"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          test -x "$THEOS/bin/nic.pl"
          test -d "$THEOS/sdks/iPhoneOS12.4.sdk"
          command -v ldid
          command -v dpkg-deb
          xcodebuild -version
          echo "Theos: $THEOS"
          ls "$THEOS/sdks"

      - name: Build Debian package
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1

      - name: Verify package
        run: |
          set -euo pipefail
          mkdir -p release

          DEB_FILE=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)

          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: No .deb package generated."
            exit 1
          fi

          dpkg-deb --info "$DEB_FILE"
          cp "$DEB_FILE" release/

      - name: Set release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AppLibrary12 ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
