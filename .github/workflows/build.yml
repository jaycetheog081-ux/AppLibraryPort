name: Build AppLibrary12

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debian Package
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: |
          brew update
          brew install ldid xz

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Verify toolchain
        run: |
          test -x "$THEOS/bin/nic.pl"
          command -v ldid
          xcodebuild -version
          echo "Theos: $THEOS"

      - name: Build Debian package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Verify package
        run: |
          set -e
          mkdir -p release

          DEB_FILE=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)

          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: No .deb package generated."
            exit 1
          fi

          cp "$DEB_FILE" release/

      - name: Set release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AppLibrary12 ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
