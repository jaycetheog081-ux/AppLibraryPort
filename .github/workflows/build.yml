name: Build AppLibrary12

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debian Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            curl \
            sudo \
            git \
            make \
            perl \
            fakeroot \
            rsync \
            zip \
            build-essential \
            libxml2

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Verify Theos installation
        run: |
          test -d "$HOME/theos"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          echo "Theos installation verified."

      - name: Build Debian package
        run: |
          export THEOS="$HOME/theos"

          make clean
          make package FINALPACKAGE=1

      - name: Verify Debian package
        run: |
          set -e

          mkdir -p release

          DEB_FILE=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)

          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: No Debian package was generated."
            exit 1
          fi

          cp "$DEB_FILE" release/

          echo "Generated package:"
          ls -lh release/

      - name: Set release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AppLibrary12 ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
